<title>Forgive Me — Babu ❤️</title>

<style>
  :root{--p1:#ff9ec4;--p2:#ff5e85;--accent:#ff2f6e}
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Poppins,Inter,system-ui;
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,var(--p1),var(--p2));
    color:#fff;
  }
  .glow{position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.35;}
  .g1{left:-8%;top:-6%;background:#ffd1e1;}
  .g2{right:-6%;bottom:-6%;background:#ffb3cf;}

  .card{
    position:relative;
    max-width:980px;
    margin:40px auto;
    padding:28px;
    border-radius:20px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(8px);
    box-shadow:0 12px 40px rgba(0,0,0,0.25);
  }
  h1{font-size:2rem;margin:0 0 10px;}
  p.lead{margin:0 0 14px;opacity:.95;}

  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
    margin-top:14px;
  }

  .gallery .tile{
    padding:6px;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:120px;
  }

  .gallery img{max-width:100%;border-radius:10px;}

  .controls{text-align:center;margin-top:16px;}
  .btn{
    padding:10px 26px;
    border:none;
    margin:0 8px;
    border-radius:18px;
    cursor:pointer;
    font-size:1.05rem;
  }
  .btn.yes{background:var(--accent);color:#fff;}
  .btn.no{background:#fff;color:var(--accent);}

  .final{display:grid;place-items:center;padding:30px;}
  .signatureText{font-family:'Pacifico',cursive;font-size:32px;fill:#fff;}

  @keyframes pulseHeart{
    0%{transform:scale(1);}
    50%{transform:scale(1.18);}
    100%{transform:scale(1);}
  }
</style>
</head>

<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="card" id="card">
  <div id="content"></div>

function pickImages(n=9){
  const arr=[];
  for(let i=0;i<n;i++){
    arr.push( IMAGE_POOL[Math.floor(Math.random()*IMAGE_POOL.length)] );
  }
  return arr;
}

let noIndex = 0;
const MAX_NO = 50;
const content = document.getElementById("content");

function buildPage(){
  const line = NO_LINES[noIndex];
  const imgs = pickImages(9);

  content.innerHTML = `
    <h1>Babu please… 😘❤️</h1>
    <p class="lead">${line} 😘</p>

    <div class="gallery">
      ${imgs.map(src=>`<div class="tile"><img src="${src}" onerror="this.src='https://i.ibb.co/ZK9kG1d/c4.png'"></div>`).join("")}
    </div>

    <div class="controls">
      <button class="btn yes">Yes</button>
      <button class="btn no">No</button>
    </div>
  `;
}

document.addEventListener("click",e=>{
  if(e.target.classList.contains("no")){
    noIndex = (noIndex + 1) % MAX_NO;
    buildPage();
  }
  if(e.target.classList.contains("yes")){
    showYesPage();
  }
});

    s.style.transition="all 1s ease";
    s.style.opacity=1;
  },350);

  const canvas=document.getElementById("glitterCanvas");
  const ctx=canvas.getContext("2d");

  function resizeCanvas(){
    canvas.width=canvas.offsetWidth;
    canvas.height=canvas.offsetHeight;
  }
  resizeCanvas();
  window.addEventListener("resize",resizeCanvas);

  const particles=[];
  for(let i=0;i<120;i++){
    particles.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*1.6+0.6,
      dx:(Math.random()-0.5)*0.3,
      dy:(Math.random()-0.5)*0.3,
      alpha:Math.random()*0.9+0.2
    });
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      ctx.beginPath();
      ctx.fillStyle=`rgba(255,255,255,${p.alpha})`;
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      p.x+=p.dx;p.y+=p.dy;
      if(p.x<0)p.x=canvas.width;
      if(p.x>canvas.width)p.x=0;
      if(p.y<0)p.y=canvas.height;
      if(p.y>canvas.height)p.y=0;
    });
    requestAnimationFrame(draw);
  }
  draw();
}

buildPage();
</script>
</body>
</html>
